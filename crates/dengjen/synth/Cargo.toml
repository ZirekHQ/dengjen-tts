[package]
name = "dengjen-tts"
version = "0.2.0"
edition = "2021"
license.workspace = true

[lints]
workspace = true

[lib]
name = "dengjen_tts"

[dependencies]
dengjen-tts-core = { path = "../core" }
sonic-sys = { path = "../../audio/sonic-sys" }
audio-ops = { path = "../../audio/ops" }
rayon = "1.7.0"
once_cell = "1.18.0"
flume = { version = "0.11.0", default-features = false, features = ["async"] }
serde_json = "1.0.89"

[dev-dependencies]
dengjen-tts-piper = { path = "../models/piper" }
dengjen-tts-kokoro = { path = "../models/kokoro" }
once_cell = "1.18.0"
divan = "0.1.2"
tempfile = "3"

[dev-dependencies.ort]
version = "2.0.0-rc.13"
default-features = false
features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"]

[[bench]]
name = "benchmarks"
path = "src/benchmarks.rs"
harness = false

[[test]]
name = "tests"
path = "src/tests.rs"
