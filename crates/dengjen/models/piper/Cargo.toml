[package]
name = "dengjen-piper"
version = "0.2.0"
edition = "2021"

[features]
default = ["tashkeel", "espeak"]
tashkeel = ["dep:libtashkeel_core"]
# espeak-ng is GPL-3.0-or-later. Default-on for now to avoid breaking existing users;
# disable with --no-default-features/--features tashkeel for a pure-MIT build. See #10.
espeak = ["dep:espeak-phonemizer"]

[dependencies]
espeak-phonemizer = { path = "../../../text/espeak-phonemizer", optional = true }
dengjen-core = { path = "../../core" }
ndarray = "0.17"
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.89"

[dependencies.libtashkeel_core]
version = "1.2.0"
default-features = false
features = ["ort", "rayon"]
optional = true

[dependencies.ort]
version = "2.0.0-rc.13"
default-features = false
features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"]
