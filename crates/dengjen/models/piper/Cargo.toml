[package]
name = "dengjen-tts-piper"
version = "0.2.0"
edition = "2021"
license.workspace = true

[lints]
workspace = true

[features]
default = ["tashkeel", "espeak"]
tashkeel = ["dep:dengjen-tashkeel"]
hebrew = ["dep:hebrew-phonemizer"]
pinyin = ["dep:pinyin-phonemizer"]
# espeak-ng is GPL-3.0-or-later. Default-on for now to avoid breaking existing users.
espeak = ["dep:espeak-phonemizer"]
# GPU execution providers, opt-in per platform. Inference falls back to CPU at runtime if the
# provider fails to initialize (see inference::execution_providers).
cuda = ["ort/cuda"]
coreml = ["ort/coreml"]
directml = ["ort/directml"]

[dependencies]
espeak-phonemizer = { path = "../../../text/espeak-phonemizer", optional = true }
hebrew-phonemizer = { path = "../../../text/hebrew-phonemizer", optional = true }
pinyin-phonemizer = { path = "../../../text/pinyin-phonemizer", optional = true }
dengjen-tts-core = { path = "../../core" }
ndarray = "0.17"
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.89"

[dependencies.dengjen-tashkeel]
version = "1.5.1"
default-features = false
features = ["ort", "rayon"]
optional = true

[dependencies.ort]
version = "2.0.0-rc.13"
default-features = false
features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"]
