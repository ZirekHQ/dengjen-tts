[package]
name = "dengjen-tts-kokoro"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Kokoro neural TTS model backend for the dengjen-tts speech synthesis engine"
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
default = []
espeak = ["dep:dengjen-espeak-phonemizer"]


cuda = ["ort/cuda"]
coreml = ["ort/coreml"]
directml = ["ort/directml"]

[dependencies]
dengjen-tts-core.workspace = true
dengjen-espeak-phonemizer = { workspace = true, optional = true }
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.89"
ndarray = "0.17"
tracing = "0.1"

[dependencies.ort]
version = "2.0.0-rc.13"
default-features = false
features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"]

[dev-dependencies]
tracing-test = { version = "0.2", features = ["no-env-filter"] }
