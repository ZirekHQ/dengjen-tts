[package]
name = "dengjen-tts-cli"
version = "0.2.0"
edition = "2021"
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "dengjen"
path = "src/main.rs"

[features]
default = ["espeak"]
espeak = ["dengjen-tts-piper/espeak", "dengjen-tts-kokoro/espeak"]
# Forwards to both model backends; ort/cuda alone (the previous wiring) never reached a
# Session::builder() call, so enabling it did nothing.
cuda = ["dengjen-tts-piper/cuda", "dengjen-tts-kokoro/cuda"]
coreml = ["dengjen-tts-piper/coreml", "dengjen-tts-kokoro/coreml"]
directml = ["dengjen-tts-piper/directml", "dengjen-tts-kokoro/directml"]
ort-dylib = ["ort/load-dynamic"]

[dependencies]
dengjen-tts = { version = "0.2.0", path = "../../dengjen/synth" }
dengjen-tts-piper = { version = "0.2.0", path = "../../dengjen/models/piper" }
dengjen-tts-kokoro = { version = "0.1.0", path = "../../dengjen/models/kokoro", default-features = false }
anyhow = "1.0.79"
env_logger = "0.10.0"
log = "0.4.18"
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.89"

[dependencies.clap]
version = "4.3.2"
features = ["derive",]

[dependencies.ort]
version = "2.0.0-rc.13"
default-features = false
features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"]
