[package]
name = "dengjen-cli"
version = "0.2.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "dengjen"
path = "src/main.rs"

[features]
default = ["espeak"]
espeak = ["dengjen-piper/espeak", "dengjen-kokoro/espeak"]
cuda = ["ort/cuda"]
ort-dylib = ["ort/load-dynamic"]

[dependencies]
dengjen-synth = { version = "0.2.0", path = "../../dengjen/synth" }
dengjen-piper = { version = "0.2.0", path = "../../dengjen/models/piper" }
dengjen-kokoro = { version = "0.1.0", path = "../../dengjen/models/kokoro", default-features = false }
anyhow = "1.0.79"
env_logger = "0.10.0"
log = "0.4.18"
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.89"

[dependencies.clap]
version = "4.3.2"
features = ["derive",]

[dependencies.ort]
version = "2.0.0-rc.13"
default-features = false
features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"]
