syntax = "proto3";

package dengjen_grpc;

service DengjenGrpc {

  rpc GetDengjenVersion(Empty) returns (Version) {}

  
  rpc LoadVoice(VoiceConfigLocation) returns (VoiceDescriptor) {}

  
  rpc GetVoiceInfo(VoiceRef) returns (VoiceDescriptor) {}

  
  rpc GetSynthesisOptions(VoiceRef) returns (SynthesisSettings) {}

  
  rpc SetSynthesisOptions(VoiceSynthesisSettings) returns (SynthesisSettings) {}

  
  rpc SynthesizeUtterance(SynthesisRequest) returns (stream SynthesisChunk) {}

  
  rpc SynthesizeUtteranceRealtime(SynthesisRequest) returns (stream RealtimeAudioChunk) {}
}

enum SynthesisMode {
  MODE_UNSPECIFIED = 0;
  MODE_LAZY = 1;
  MODE_PARALLEL = 2;
  MODE_BATCHED = 3;
}
enum VoiceQuality {
  VOICE_QUALITY_UNSPECIFIED = 0;
  VOICE_QUALITY_X_LOW = 1;
  VOICE_QUALITY_LOW = 2;
  VOICE_QUALITY_MEDIUM = 3;
  VOICE_QUALITY_HIGH = 4;
}

message Empty {}

message Version {
    string version = 1;
}

message VoiceRef {
    string voice_key = 1;
}

message VoiceDescriptor {
  string voice_key = 1;
  SynthesisSettings synthesis_options = 2;
  map<int64, string> speakers = 3;
  AudioFormat audio = 4;
  optional string language = 5;
  optional VoiceQuality quality = 6;
  optional bool supports_streaming_output = 7;
}

message VoiceConfigLocation {
  string path = 1;
}


message SynthesisRequest {
  string voice_key = 1;
  string text = 2;
  ProsodyControls prosody = 3;
  SynthesisMode synthesis_mode = 4;
}

message SynthesisSettings {
  optional string speaker = 1;
  optional float length_scale = 2;
  optional float noise_scale = 3;
  optional float noise_w = 4;
  
  
  
  map<string, float> parameters = 5;
}

message VoiceSynthesisSettings{
    string voice_key = 1;
    SynthesisSettings synthesis_options = 2;
}


message AudioFormat {
  uint32 sample_rate = 1;
  uint32 num_channels = 2;
  uint32 sample_width = 3;
}


message SynthesisChunk {
  bytes audio_bytes = 1;
  float real_time_factor = 2;
}

message RealtimeAudioChunk {
  bytes audio_bytes = 1;
}

message ProsodyControls {
    optional uint32 rate =1;
    optional uint32 volume =2;
    optional uint32 pitch =3;
    optional uint32 appended_silence_ms =4;
}
