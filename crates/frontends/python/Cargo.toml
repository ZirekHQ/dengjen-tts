[package]
name = "dengjen-python"
version = "0.2.0"
edition = "2021"

[lib]
name = "pydengjen"
crate-type = ["cdylib"]

[features]
default = []
ort-dylib = ["ort/load-dynamic"]

[dependencies]
espeak-phonemizer = { path = "../../text/espeak-phonemizer" }
dengjen-core = { path = "../../dengjen/core" }
dengjen-synth = { path = "../../dengjen/synth" }
dengjen-piper = { path = "../../dengjen/models/piper" }
once_cell = "1.19.0"

[dependencies.libtashkeel_core]
version = "1.2.0"
default-features = false
features = ["ort", "rayon"]

[dependencies.pyo3]
version = "0.20.0"
features = ["extension-module", "abi3-py37"]

[dependencies.ort]
version = "2.0.0-rc.9"

[build-dependencies]
fs_extra = "1.3.0"
