[package]
name = "dengjen-tts-python"
version = "0.2.0"
edition = "2021"
license.workspace = true

[lints]
workspace = true

[lib]
name = "pydengjen"
crate-type = ["cdylib"]

[features]
default = ["tashkeel", "espeak"]
ort-dylib = ["ort/load-dynamic"]
tashkeel = ["dep:libtashkeel_core", "dengjen-tts-piper/tashkeel"]
espeak = ["dep:espeak-phonemizer", "dengjen-tts-piper/espeak", "dengjen-tts-kokoro/espeak", "dengjen-tts-melotts/espeak"]
# Forwards to both model backends; ort/cuda alone (the previous wiring) never reached a
# Session::builder() call, so enabling it did nothing.
cuda = ["dengjen-tts-piper/cuda", "dengjen-tts-kokoro/cuda", "dengjen-tts-melotts/cuda"]
coreml = ["dengjen-tts-piper/coreml", "dengjen-tts-kokoro/coreml", "dengjen-tts-melotts/coreml"]
directml = ["dengjen-tts-piper/directml", "dengjen-tts-kokoro/directml", "dengjen-tts-melotts/directml"]

[dependencies]
espeak-phonemizer = { path = "../../text/espeak-phonemizer", optional = true }
dengjen-tts-core = { path = "../../dengjen/core" }
dengjen-tts = { path = "../../dengjen/synth" }
dengjen-tts-piper = { path = "../../dengjen/models/piper", default-features = false }
dengjen-tts-kokoro = { version = "0.1.0", path = "../../dengjen/models/kokoro", default-features = false }
dengjen-tts-melotts = { version = "0.1.0", path = "../../dengjen/models/melotts", default-features = false }
once_cell = "1.18.0"

[dependencies.libtashkeel_core]
version = "1.5.1"
default-features = false
features = ["ort", "rayon"]
optional = true

[dependencies.pyo3]
version = "0.29.1"
features = ["extension-module", "abi3-py39"]

[dependencies.ort]
version = "2.0.0-rc.13"
default-features = false
features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"]

[build-dependencies]
fs_extra = "1.3.0"
