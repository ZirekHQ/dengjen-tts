sonar.projectKey=ZirekHQ_dengjen-tts
sonar.organization=zirekhq

# SonarCloud has no Rust analyzer, so the bulk of this repo (crates/**) isn't
# scanned here. Rust-native checks (clippy, cargo audit) live in
# .github/workflows/rust-lint.yml instead. This only covers what SonarCloud
# can actually analyse: the Python bindings, the Go and Java bindings, and
# the workflow files themselves.
sonar.sources=crates/frontends/python/python,crates/frontends/python/example.py,bindings/go,bindings/java,.github/workflows

sonar.python.version=3.7
sonar.sourceEncoding=UTF-8

# Generated by .github/workflows/sonar.yml before the scan step runs (jacocoTestReport merges
# test/integrationTest/e2e into one XML; `go test -coverprofile` writes the Go one directly).
sonar.coverage.jacoco.xmlReportPaths=bindings/java/build/reports/jacoco/test/jacocoTestReport.xml
sonar.go.coverage.reportPaths=bindings/go/coverage.out
