sonar.projectKey=austek_sonata
sonar.organization=austek

# SonarCloud has no Rust analyzer, so the bulk of this repo (crates/**) isn't
# scanned here. Rust-native checks (clippy, cargo audit) live in
# .github/workflows/rust-lint.yml instead. This only covers what SonarCloud
# can actually analyse: the Python bindings and the workflow files themselves.
sonar.sources=crates/frontends/python/python,crates/frontends/python/example.py,.github/workflows

sonar.python.version=3.7
sonar.sourceEncoding=UTF-8
