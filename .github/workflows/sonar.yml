name: Sonar

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# SonarCloud keeps whichever report finishes processing last, not the newest
# commit, so overlapping scans can leave main showing an older analysis.
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: Sonar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Fork PRs are never given repository secrets, so SONAR_TOKEN would be empty
    # and the scan would fail with a red X the contributor cannot clear.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0  # Sonar needs full history for new-code detection and blame
          submodules: recursive
          persist-credentials: false

      # The Go and Java bindings are compiled against libdengjen (crates/frontends/capi), so
      # generating real coverage for them -- rather than leaving sonar.coverage at 0% -- means
      # building it here first, same toolchain as .github/workflows/rust-lint.yml's
      # bindings-java/bindings-go jobs.
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev llvm-dev cmake protobuf-compiler
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Java bindings coverage
        working-directory: bindings/java
        run: make coverage

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
      - name: Go bindings coverage
        working-directory: bindings/go
        run: make coverage

      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
