name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      new_tag:
        description: "Override the vX.Y.Z tag"
        required: false
        type: string
      previous_tag:
        description: "Override Java changelog baseline"
        required: false
        type: string
      dry_run:
        description: "Dry Run: publish nothing"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    # head_commit is absent on workflow_dispatch, hence the event_name check first.
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: bump workspace version -> ')"
    permissions:
      contents: write
      # Needed for `gh workflow run` below; GITHUB_TOKEN can't dispatch from a `push`-triggered run (recursion guard).
      actions: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: true

      - name: Resolve workspace version
        id: version
        env:
          NEW_TAG: ${{ inputs.new_tag }}
        run: |
          set -euo pipefail
          if [ -n "${NEW_TAG:-}" ]; then
            version="${NEW_TAG#v}"
            if ! echo "$version" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "::error::new_tag '${NEW_TAG}' doesn't look like a vX.Y.Z tag" >&2
              exit 1
            fi
          else
            version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        if: inputs.dry_run != true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Checked against origin, not the local clone -- checkout's shallow fetch wouldn't reliably reflect a tag pushed by an earlier attempt.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          existing="$(git ls-remote origin "refs/tags/v${VERSION}" | cut -f1)"
          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::v${VERSION} already exists on origin and points at ${existing}, not this commit (${GITHUB_SHA})" >&2
              exit 1
            fi
            echo "v${VERSION} already exists on origin and points at this commit -- reusing it"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          else
            echo "::error::Refusing to create v${VERSION} from ${GITHUB_REF} -- release tags are only created from main" >&2
            exit 1
          fi

      - name: Trigger PyPI release (CI.yml)
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        # Dispatched against the real v${VERSION} tag, not `main` -- main can move between the tag push and this step.
        run: gh workflow run CI.yml --ref "v${VERSION}"

  approve:
    name: Approve release
    needs: tag-and-release
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - env:
          VERSION: ${{ needs.tag-and-release.outputs.version }}
        run: echo "Approved v${VERSION} for release"

  # always() is paired with an explicit success-or-skipped check, not a bare "run regardless" --
  # needed because `approve` is legitimately skipped, not failed, on a dry run.
  crates:
    name: crates.io
    needs: [tag-and-release, approve]
    if: always() && needs.tag-and-release.result == 'success' && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    permissions:
      contents: read
    uses: $/.github/workflows/publish.yml
    with:
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  java:
    name: Maven Central (Java bindings)
    needs: [tag-and-release, approve]
    if: always() && needs.tag-and-release.result == 'success' && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    permissions:
      contents: write
    uses: $/.github/workflows/java-publish.yml
    with:
      tag: java-v${{ needs.tag-and-release.outputs.version }}
      previous_tag: ${{ inputs.previous_tag }}
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
      JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
      JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
      JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
      JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}

  go:
    name: dengjen-tts-go mirror
    needs: [tag-and-release, approve]
    if: always() && needs.tag-and-release.result == 'success' && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    permissions:
      contents: read
    uses: $/.github/workflows/publish-go.yml
    with:
      tag: go-release-v${{ needs.tag-and-release.outputs.version }}
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      DENGJEN_TTS_GO_DEPLOY_TOKEN: ${{ secrets.DENGJEN_TTS_GO_DEPLOY_TOKEN }}

  grpc:
    name: gRPC server GitHub Release
    needs: [tag-and-release, approve]
    if: always() && needs.tag-and-release.result == 'success' && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    permissions:
      contents: write
    uses: $/.github/workflows/publish-grpc.yml
    with:
      tag: grpc-release-v${{ needs.tag-and-release.outputs.version }}
      dry_run: ${{ inputs.dry_run == true }}

  # crates/java/go/grpc each publish their own artifact-scoped GitHub Release
  # (java-v*, grpc-release-v*), none of which represent the repo as a whole --
  # without this job the `v${VERSION}` tag from tag-and-release never gets a
  # release object, so GitHub's `/releases/latest` falls back to whichever
  # component release happened to publish last.
  github-release:
    name: Whole-repo GitHub Release
    needs: [tag-and-release, approve, crates, java, go, grpc]
    if: >-
      always() && inputs.dry_run != true &&
      needs.tag-and-release.result == 'success' &&
      (needs.approve.result == 'success' || needs.approve.result == 'skipped') &&
      needs.crates.result == 'success' && needs.java.result == 'success' &&
      needs.go.result == 'success' && needs.grpc.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag-and-release.outputs.version }}
        # Depends on every component job so this always publishes last and
        # is the one GitHub shows as "Latest". The `v${VERSION}` tag already
        # exists (pushed by tag-and-release), so this just attaches a release
        # to it; --generate-notes's output is the convention, not a draft.
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --generate-notes
