name: Publish gRPC server release

on:
  push:
    tags:
      # Not "publish-*" (crates.io, publish.yml) or "go-release-v*"
      # (publish-go.yml) — a prefix collision has already bitten this repo
      # once (see publish-go.yml's own comment on the same issue).
      - "grpc-release-v*"
  # Called directly as a job (`uses:`) from tag-and-release.yml's single
  # release pipeline right after it tags the version-bump merge commit
  # vX.Y.Z, passing tag=grpc-release-vX.Y.Z -- gated by that pipeline's own
  # dedicated `approve` job (environment: release), not by an environment
  # on `build-windows` below, so one approval covers this and the other
  # three release targets atomically. No real "grpc-release-v*" tag needs
  # to pre-exist on this repo for that -- the value below only feeds
  # version extraction and the GitHub Release's tag_name, and
  # softprops/action-gh-release creates that tag itself if it's not already
  # there, same end state a manual tag push used to produce directly. Also
  # usable for a manual retrigger -- that path carries no approval gate of
  # its own (removed in favor of the shared one above); the `check` job
  # below at least skips the (Windows, so not cheap) build entirely if this
  # version already has a release.
  workflow_dispatch:
    inputs:
      tag:
        description: "grpc-release-vX.Y.Z tag name to release (e.g. grpc-release-v1.2.3)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "grpc-release-vX.Y.Z tag name to release (e.g. grpc-release-v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check whether this version already has a GitHub Release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -uo pipefail
          resp="$(gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" 2>&1)"
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::notice::${RELEASE_TAG} already has a GitHub Release -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only a definite 404 means "no release yet" -- anything else
          # (auth, rate-limit, a 5xx blip) must fail the preflight instead
          # of silently falling through to skip=false, which would let the
          # build proceed on an inconclusive check.
          status="$(printf '%s' "$resp" | jq -r '.status // empty' 2>/dev/null)"
          if [ "$status" = "404" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::unexpected error checking for an existing GitHub Release for ${RELEASE_TAG}: ${resp}" >&2
            exit 1
          fi

  build-windows:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install-clang
        run: choco install llvm -y --no-progress
      - name: install-protoc
        # dengjen-tts-grpc's build.rs runs tonic-build/prost-build against
        # proto/dengjen_grpc.proto, which shells out to protoc — unlike
        # libdengjen (the crate publish-go.yml's build-windows job builds),
        # which compiles no proto and never needed this.
        run: choco install protoc -y --no-progress
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"
          targets: x86_64-pc-windows-msvc
      - name: cargo build (release)
        run: cargo build --release --locked -p dengjen-tts-grpc --target x86_64-pc-windows-msvc
      - name: assert no unbundled runtime dependency
        # Same check as publish-go.yml's build-windows job for libdengjen:
        # ort's copy-dylibs feature can drop a companion ONNX Runtime DLL
        # next to the build output instead of statically linking it. If that
        # happens here, the release archive below must include it too, or
        # dengjen-nvda's vendored binary silently fails to start for users.
        shell: bash
        env:
          OUT_DIR: target/x86_64-pc-windows-msvc/release
        run: |
          set -euo pipefail
          exe="${OUT_DIR}/dengjen-tts-grpc.exe"
          deps="$(llvm-objdump -p "$exe" | sed -n 's/^[[:space:]]*DLL Name:[[:space:]]*//p')"
          echo "Imported DLLs of ${exe}:"
          echo "$deps"
          rc=0
          while IFS= read -r dep; do
            case "$dep" in
              *onnxruntime*|*ONNXRUNTIME*)
                if [[ ! -e "${OUT_DIR}/${dep}" ]]; then
                  echo "::error::${exe} imports ${dep}, which is not produced alongside it and would not be bundled" >&2
                  rc=1
                fi
                ;;
            esac
          done <<< "$deps"
          exit "$rc"
      - name: extract target version
        id: version
        shell: bash
        env:
          # inputs.tag on a workflow_dispatch run (see the trigger comment
          # above); github.ref_name on a real tag push, where it already is
          # the grpc-release-v* tag name itself.
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          version="${tag#grpc-release-}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${tag}' does not carry a valid vX.Y.Z suffix" >&2
            exit 1
          fi
          # Catches a tag that drifted from the workspace version it's meant
          # to name — otherwise this workflow happily publishes e.g.
          # grpc-release-v1.1.1 while [workspace.package].version still says
          # 1.1.0, mislabeling the release asset. dengjen-tts-grpc's own
          # Cargo.toml has no literal version string to read anymore (it's
          # `version.workspace = true`), so this reads the single source of
          # truth in the root Cargo.toml instead.
          crate_version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          if [[ "$version" != "v${crate_version}" ]]; then
            echo "Tag version '${version}' does not match workspace package version 'v${crate_version}'" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: package release asset
        # Globbed onnxruntime copy so a companion DLL (see the assertion
        # step above) ships in the same archive as the exe, if one exists.
        # Compress-Archive (built into the windows-2022 image) is used
        # instead of 7z to avoid depending on a tool this workflow never
        # verifies is present.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/dengjen-tts-grpc.exe release/
          Get-ChildItem target/x86_64-pc-windows-msvc/release/*onnxruntime* -ErrorAction SilentlyContinue |
            Copy-Item -Destination release/
          Copy-Item NOTICE release/
          $zipName = "dengjen-tts-grpc-$env:STEPS_VERSION_OUTPUTS_VERSION-windows-x64.zip"
          Compress-Archive -Path release/* -DestinationPath $zipName
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT
        id: package
        env:
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
      - name: create release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          # action-gh-release defaults an unset target_commitish to the
          # repo's default branch, not the commit this run actually
          # checked out -- on a workflow_dispatch run (this tag doesn't
          # exist yet), that would create grpc-release-vX.Y.Z pointing at
          # whatever main is by the time this step runs, not the tagged
          # release commit. Pin it explicitly.
          target_commitish: ${{ github.sha }}
          name: dengjen-tts-grpc ${{ steps.version.outputs.version }}
          files: ${{ steps.package.outputs.zip_name }}
