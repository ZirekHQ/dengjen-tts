name: Publish gRPC server release

on:
  # No `environment:` gate on the jobs below -- release.yml's shared `approve` job covers it when
  # called from there, but a manual dispatch of this file bypasses that entirely.
  workflow_dispatch:
    inputs:
      tag:
        description: "grpc-release-vX.Y.Z to release"
        required: true
        type: string
      dry_run:
        description: "Dry Run: publish nothing"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        description: "grpc-release-vX.Y.Z to release"
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check whether this version already has a GitHub Release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -uo pipefail
          # `if resp=$(...)` (not a bare assignment) keeps a 404's non-zero exit from tripping this
          # step's implicit `bash -e`. Capture stdout only: gh api's stderr diagnostic would corrupt the JSON below.
          if resp="$(gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}")"; then
            echo "::notice::${RELEASE_TAG} already has a GitHub Release -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status="$(printf '%s' "$resp" | jq -r '.status // empty' 2>/dev/null)"
          if [ "$status" = "404" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::unexpected error checking for an existing GitHub Release for ${RELEASE_TAG}: ${resp}" >&2
            exit 1
          fi

  build-windows:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install-clang
        run: choco install llvm -y --no-progress
      - name: install-protoc
        # dengjen-tts-grpc's build.rs shells out to protoc (tonic-build/prost-build); unlike libdengjen, it compiles a .proto.
        run: choco install protoc -y --no-progress
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"
          targets: x86_64-pc-windows-msvc
      - name: cargo build (release)
        run: cargo build --release --locked -p dengjen-tts-grpc --target x86_64-pc-windows-msvc
      - name: assert no unbundled runtime dependency
        # Same check as publish-go.yml's build-windows job: ort's copy-dylibs feature can drop a
        # companion ONNX Runtime DLL next to the build output instead of statically linking it -- the
        # release archive below must include it too, or dengjen-nvda's vendored binary fails to start.
        shell: bash
        env:
          OUT_DIR: target/x86_64-pc-windows-msvc/release
        run: |
          set -euo pipefail
          exe="${OUT_DIR}/dengjen-tts-grpc.exe"
          deps="$(llvm-objdump -p "$exe" | sed -n 's/^[[:space:]]*DLL Name:[[:space:]]*//p')"
          echo "Imported DLLs of ${exe}:"
          echo "$deps"
          rc=0
          while IFS= read -r dep; do
            case "$dep" in
              *onnxruntime*|*ONNXRUNTIME*)
                if [[ ! -e "${OUT_DIR}/${dep}" ]]; then
                  echo "::error::${exe} imports ${dep}, which is not produced alongside it and would not be bundled" >&2
                  rc=1
                fi
                ;;
            esac
          done <<< "$deps"
          exit "$rc"
      - name: extract target version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          version="${tag#grpc-release-}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${tag}' does not carry a valid vX.Y.Z suffix" >&2
            exit 1
          fi
          # Catches a tag drifted from the workspace version it's meant to name -- otherwise this
          # workflow happily mislabels the release asset. dengjen-tts-grpc's own Cargo.toml has no
          # literal version (it's `version.workspace = true`), so this reads the root Cargo.toml instead.
          crate_version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          if [[ "$version" != "v${crate_version}" ]]; then
            echo "Tag version '${version}' does not match workspace package version 'v${crate_version}'" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: package release asset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/dengjen-tts-grpc.exe release/
          Get-ChildItem target/x86_64-pc-windows-msvc/release/*onnxruntime* -ErrorAction SilentlyContinue |
            Copy-Item -Destination release/
          Copy-Item NOTICE release/
          $zipName = "dengjen-tts-grpc-$env:STEPS_VERSION_OUTPUTS_VERSION-windows-x64.zip"
          Compress-Archive -Path release/* -DestinationPath $zipName
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT
        id: package
        env:
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
      - name: create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          # gh release create defaults an unset --target to the repo's default branch, not the
          # commit checked out -- on workflow_dispatch that'd point at whatever main is by then. Pin it.
          RELEASE_SHA: ${{ github.sha }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if ($env:DRY_RUN -eq "true") {
            Write-Host "DRY RUN -- would create GitHub release $env:RELEASE_TAG with asset $env:ZIP_NAME targeting $env:RELEASE_SHA, skipping"
          } else {
            gh release create $env:RELEASE_TAG $env:ZIP_NAME `
              --target $env:RELEASE_SHA `
              --title "dengjen-tts-grpc $env:RELEASE_VERSION" `
              --notes ""
          }
