name: Notify docs site

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Ref or tag to notify about (defaults to the current ref)
        required: false
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "ref=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${INPUT_REF:-$REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build payload
        id: payload
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ steps.resolve.outputs.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          payload=$(jq -nc --arg repository "$REPOSITORY" --arg ref "$REF" --arg actor "$ACTOR" \
            '{repository: $repository, ref: $ref, actor: $actor}')
          echo "json=$payload" >> "$GITHUB_OUTPUT"

      - name: Dispatch update to docs site
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          repository: ZirekHQ/ZirekHQ.github.io
          event-type: update-docs
          client-payload: ${{ steps.payload.outputs.json }}
