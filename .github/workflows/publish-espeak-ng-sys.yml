name: Publish dengjen-espeak-ng-sys to crates.io

# dengjen-espeak-ng-sys is not a workspace member: it's assembled here, at release time, from
# the deps/espeak-rs-piper submodule (build.rs/wrapper.h/src glue + the vendored espeak-ng C
# tree) plus the small metadata template in .github/publish-templates/dengjen-espeak-ng-sys/.
# Nothing gets vendored into dengjen-tts's own tree between releases.

on:
  push:
    tags:
      - "publish-espeak-ng-sys-*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev llvm-dev cmake
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"

      - name: assemble crate from submodule + template
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/dengjen-espeak-ng-sys"
          src="deps/espeak-rs-piper/crates/espeak-rs-sys"
          template=".github/publish-templates/dengjen-espeak-ng-sys"

          mkdir -p "$stage"
          cp "$template/Cargo.toml" "$stage/Cargo.toml"
          cp "$template/README.md" "$stage/README.md"
          cp "$src/build.rs" "$stage/build.rs"
          cp "$src/wrapper.h" "$stage/wrapper.h"
          cp -r "$src/src" "$stage/src"
          cp -r "$src/espeak-ng" "$stage/espeak-ng"

          echo "STAGE_DIR=$stage" >> "$GITHUB_ENV"

      # Build/verify before CARGO_REGISTRY_TOKEN enters the environment, so a
      # malicious build.rs in the assembled crate (or a dependency) has no
      # token to exfiltrate — see publish.yml for the same pattern.
      - name: verify dengjen-espeak-ng-sys
        run: cargo publish --dry-run --manifest-path "${STAGE_DIR}/Cargo.toml"
      - name: publish dengjen-espeak-ng-sys
        # No --locked: the staged crate has no pre-existing Cargo.lock to validate against
        # (it's assembled fresh each release, not a committed workspace member).
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path "${STAGE_DIR}/Cargo.toml" --no-verify
      - name: wait for crate to index
        run: bash .github/scripts/wait-for-crate.sh dengjen-espeak-ng-sys 0.2.1
