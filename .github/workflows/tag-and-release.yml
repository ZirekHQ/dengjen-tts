name: Tag and trigger release

# Fires on every push to main, but only acts on the commit that lands
# prepare-release.yml's version-bump PR (identified by its exact commit
# subject -- squash- or rebase-merging that PR always produces this
# message, since it's the only commit on that branch). Every other push to
# main is a no-op here.
#
# Tags that commit vX.Y.Z (the baseline scripts/next-version.sh's next run
# diffs Conventional Commits from) and runs every downstream release target
# as a job in *this same run*: crates.io (publish.yml), Maven Central
# (java-publish.yml), the ZirekHQ/dengjen-tts-go mirror (publish-go.yml),
# and the gRPC server's GitHub Release (publish-grpc.yml) are called
# directly via `uses:`, not dispatched as separate workflow runs. All four
# gate on the single `approve` job below (the only job in this file with
# `environment: release`) rather than each having its own environment --
# one approval unblocks all four atomically, and there's no way to approve
# only some of them, unlike letting each called job independently reference
# the environment (which GitHub would let a reviewer approve piecemeal in
# the same "review pending deployments" screen). The tradeoff: since
# publish.yml/java-publish.yml/publish-go.yml/publish-grpc.yml no longer
# carry their own environment gate, a direct manual `workflow_dispatch` (or,
# for the latter three, a hand-pushed java-v*/go-release-v*/grpc-release-v*
# tag) on any of them now publishes with no approval at all -- see each
# file's own header comment. PyPI (CI.yml's release job) is the one target
# excluded from this gate entirely: it carries no environment protection of
# its own, so it's still fired with a plain `gh workflow run` against the
# tag, same as before. Collapses what used to be five separate manual tag
# pushes into the single "review and merge the bump PR" gate, now backed by
# one all-or-nothing approval click for the four that need one.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    # head_commit is the single new commit a squash/rebase merge produces;
    # a push landing more than one new commit at once (not this repo's
    # normal PR flow) would only inspect the last of them.
    if: "startsWith(github.event.head_commit.message, 'chore: bump workspace version -> ')"
    permissions:
      contents: write
      # workflow_dispatch is the one event type GITHUB_TOKEN is explicitly
      # allowed to trigger a new run for -- unlike `push`, which it's
      # deliberately blocked from re-triggering to prevent recursive runs
      # (see "Triggering a workflow" in GitHub's Actions docs). No PAT
      # needed for the "Trigger PyPI release" step below because of that;
      # it's also why the vX.Y.Z tag pushed here doesn't itself fire
      # CI.yml's own tag-push trigger -- it's invoked explicitly instead.
      actions: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: true

      - name: Resolve workspace version
        id: version
        run: |
          set -euo pipefail
          version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Idempotent: a retry after this job fails partway through (e.g. a
        # transient failure in the dispatch step below) must not hard-fail
        # here just because v${VERSION} already exists from the first
        # attempt. Checked against origin directly, not the local clone --
        # checkout's default fetch-depth wouldn't reliably reflect a tag
        # pushed by an earlier attempt.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          existing="$(git ls-remote origin "refs/tags/v${VERSION}" | cut -f1)"
          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::v${VERSION} already exists on origin and points at ${existing}, not this commit (${GITHUB_SHA})" >&2
              exit 1
            fi
            echo "v${VERSION} already exists on origin and points at this commit -- reusing it"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Trigger PyPI release (CI.yml)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        # Dispatched against the real v${VERSION} tag ref (just pushed
        # above), not `main` -- main can move between the tag push and this
        # step (another PR merging in that gap), and dispatching against
        # `main` would build and publish whatever commit main happens to be
        # at by then, not the one actually tagged. This is the one release
        # target still fired as a separate workflow_dispatch run rather than
        # a job below, because it carries no `environment: release` gate to
        # batch into the others' approval.
        run: gh workflow run CI.yml --ref "v${VERSION}"

  # The one job in this file gated on the `release` environment. All four
  # release-target jobs below `needs: approve`, so a single reviewer
  # decision unblocks (or leaves blocked) all four together -- there's no
  # per-target approval to grant or withhold separately.
  approve:
    name: Approve release
    needs: tag-and-release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - env:
          VERSION: ${{ needs.tag-and-release.outputs.version }}
        run: echo "Approved v${VERSION} for release"

  # Each of these calls the target workflow directly as a job of this same
  # run (rather than `gh workflow run`-dispatching a separate run against
  # the vX.Y.Z tag), so the checkout inside each defaults to this run's own
  # github.sha -- which is already the version-bump commit this job just
  # tagged, no explicit --ref needed.
  crates:
    name: crates.io
    needs: [tag-and-release, approve]
    permissions:
      contents: read
    uses: $/.github/workflows/publish.yml
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  java:
    name: Maven Central (Java bindings)
    needs: [tag-and-release, approve]
    permissions:
      contents: write
    uses: $/.github/workflows/java-publish.yml
    with:
      tag: java-v${{ needs.tag-and-release.outputs.version }}
    secrets:
      JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
      JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
      JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
      JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
      JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}

  go:
    name: dengjen-tts-go mirror
    needs: [tag-and-release, approve]
    permissions:
      contents: read
    uses: $/.github/workflows/publish-go.yml
    with:
      tag: go-release-v${{ needs.tag-and-release.outputs.version }}
    secrets:
      DENGJEN_TTS_GO_DEPLOY_TOKEN: ${{ secrets.DENGJEN_TTS_GO_DEPLOY_TOKEN }}

  grpc:
    name: gRPC server GitHub Release
    needs: [tag-and-release, approve]
    permissions:
      contents: write
    uses: $/.github/workflows/publish-grpc.yml
    with:
      tag: grpc-release-v${{ needs.tag-and-release.outputs.version }}
