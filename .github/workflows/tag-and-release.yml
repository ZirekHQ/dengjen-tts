name: Tag and trigger release

# Fires on every push to main, but only acts on the commit that lands
# prepare-release.yml's version-bump PR (identified by its exact commit
# subject -- squash- or rebase-merging that PR always produces this
# message, since it's the only commit on that branch). Every other push to
# main is a no-op here.
#
# Tags that commit vX.Y.Z (the baseline scripts/next-version.sh's next run
# diffs Conventional Commits from) and directly triggers every downstream
# release workflow, collapsing what used to be five separate manual tag
# pushes -- vX.Y.Z itself (for CI.yml's PyPI wheel-publish job, gated on
# refs/tags/*), publish-N (crates.io), java-vX.Y.Z (Maven Central),
# go-release-vX.Y.Z (the ZirekHQ/dengjen-tts-go mirror), and
# grpc-release-vX.Y.Z (the gRPC server's GitHub Release) -- into the single
# "review and merge the bump PR" gate.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    # head_commit is the single new commit a squash/rebase merge produces;
    # a push landing more than one new commit at once (not this repo's
    # normal PR flow) would only inspect the last of them.
    if: "startsWith(github.event.head_commit.message, 'chore: bump workspace version -> ')"
    permissions:
      contents: write
      # workflow_dispatch is the one event type GITHUB_TOKEN is explicitly
      # allowed to trigger a new run for -- unlike `push`, which it's
      # deliberately blocked from re-triggering to prevent recursive runs
      # (see "Triggering a workflow" in GitHub's Actions docs). No PAT
      # needed for the "Trigger downstream releases" step below because of
      # that; it's also why the vX.Y.Z tag pushed here doesn't itself fire
      # CI.yml's (or the other workflows') own tag-push triggers -- each is
      # invoked explicitly instead.
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: true

      - name: Resolve workspace version
        id: version
        run: |
          set -euo pipefail
          version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Idempotent: a retry after this job fails partway through (e.g. a
        # transient failure in the dispatch step below) must not hard-fail
        # here just because v${VERSION} already exists from the first
        # attempt. Checked against origin directly, not the local clone --
        # checkout's default fetch-depth wouldn't reliably reflect a tag
        # pushed by an earlier attempt.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          existing="$(git ls-remote origin "refs/tags/v${VERSION}" | cut -f1)"
          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::v${VERSION} already exists on origin and points at ${existing}, not this commit (${GITHUB_SHA})" >&2
              exit 1
            fi
            echo "v${VERSION} already exists on origin and points at this commit -- reusing it"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Trigger downstream releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        # No -e: a transient failure on one `gh workflow run` call must not
        # abort the rest -- every dispatch gets attempted regardless, and
        # the step only fails at the end, after every workflow that COULD
        # be dispatched was.
        #
        # Every dispatch below runs against the real v${VERSION} tag ref
        # (just pushed above), not `main` -- main can move between the tag
        # push and this step (another PR merging in that gap), and
        # dispatching against `main` would build and publish whatever
        # commit main happens to be at by then, not the one actually
        # tagged. java-publish.yml/publish-grpc.yml/publish-go.yml also
        # take their own historically-prefixed tag NAME as a
        # workflow_dispatch input string -- used only for Maven
        # Central/GitHub Release naming, not for resolving what to check
        # out, which the `--ref` below already pins.
        run: |
          set -uo pipefail
          failed=0
          gh workflow run CI.yml --ref "v${VERSION}" || failed=1
          gh workflow run publish.yml --ref "v${VERSION}" || failed=1
          gh workflow run java-publish.yml --ref "v${VERSION}" -f "tag=java-v${VERSION}" || failed=1
          gh workflow run publish-grpc.yml --ref "v${VERSION}" -f "tag=grpc-release-v${VERSION}" || failed=1
          gh workflow run publish-go.yml --ref "v${VERSION}" -f "tag=go-release-v${VERSION}" || failed=1
          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more downstream workflow dispatches failed -- check the Actions tab and manually dispatch any that didn't fire (safe to re-dispatch any of these five for the same version: CI.yml/publish.yml/java-publish.yml/publish-grpc.yml are version-checked or idempotent, and publish-go.yml's own assemble-and-push step refuses to overwrite an already-released version's tag on ZirekHQ/dengjen-tts-go)."
            exit 1
          fi
