name: Publish Java bindings

on:
  push:
    tags:
      - "java-v*"
  # Called directly as a job (`uses:`) from tag-and-release.yml's single
  # release pipeline right after it tags the version-bump merge commit
  # vX.Y.Z, passing tag=java-vX.Y.Z -- gated by that pipeline's own
  # dedicated `approve` job (environment: release), not by an environment
  # on the `release` job below, so one approval covers this and the other
  # three release targets atomically. No real `java-v*` tag needs to exist
  # on this repo for that, since the value below is only ever used as a
  # version string (VERSIONING_GIT_TAG), not resolved as a git ref. Also
  # usable for a manual retrigger from the Actions tab -- that path carries
  # no approval gate of its own (removed in favor of the shared one above).
  workflow_dispatch:
    inputs:
      tag:
        description: "java-vX.Y.Z version string to publish (e.g. java-v1.2.3)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "java-vX.Y.Z version string to publish (e.g. java-v1.2.3)"
        required: true
        type: string
    secrets:
      JRELEASER_MAVENCENTRAL_USERNAME:
        required: true
      JRELEASER_MAVENCENTRAL_PASSWORD:
        required: true
      JRELEASER_GPG_PASSPHRASE:
        required: true
      JRELEASER_GPG_SECRET_KEY:
        required: true
      JRELEASER_GPG_PUBLIC_KEY:
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check whether this version is already on Maven Central
        id: check
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#java-v}"
          url="https://repo1.maven.org/maven2/io/github/zirekhq/dengjen-tts/${version}/dengjen-tts-${version}.pom"
          status="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
          # Only a definite 404 means "not published yet" -- anything else
          # (a 429/5xx blip, a network hiccup) must fail the preflight
          # instead of silently falling through to skip=false, which would
          # let the build proceed on an inconclusive check.
          case "$status" in
            200)
              echo "::notice::dengjen-tts ${version} is already on Maven Central -- skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unexpected HTTP ${status} checking Maven Central for dengjen-tts ${version}" >&2
              exit 1
              ;;
          esac

  build-natives:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - classifier: linux-x86_64
            runner: ubuntu-22.04
          - classifier: linux-aarch64
            runner: ubuntu-22.04-arm
          - classifier: windows-x64
            runner: windows-2022
          - classifier: macos-aarch64
            runner: macos-latest
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set CMAKE_GENERATOR for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
      - name: install libclang (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y llvm llvm-dev llvm-runtime libclang-dev
      - name: install libclang (windows)
        if: runner.os == 'Windows'
        run: choco install llvm
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: install libclang (macos)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"
      - name: Build libdengjen
        run: cargo build --release --manifest-path Cargo.toml -p libdengjen --locked
      - name: Stage native library
        shell: bash
        run: |
          mkdir -p "native-artifacts/${{ matrix.platform.classifier }}"
          case "${{ runner.os }}" in
            Linux) lib="target/release/liblibdengjen.so" ;;
            macOS) lib="target/release/liblibdengjen.dylib" ;;
            Windows) lib="target/release/libdengjen.dll" ;;
          esac
          cp "$lib" "native-artifacts/${{ matrix.platform.classifier }}/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.platform.classifier }}
          path: native-artifacts/${{ matrix.platform.classifier }}

  release:
    needs: [check, build-natives]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0 # needed for JReleaser's conventional-commits changelog; VERSIONING_GIT_TAG (below) drives the actual version resolution
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 25
          distribution: temurin
          cache: gradle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bindings/java/native-artifacts
          pattern: "native-*"
      - name: Flatten downloaded native artifacts
        working-directory: bindings/java/native-artifacts
        run: for d in native-*; do mv "$d" "${d#native-}"; done
      - name: Publish
        working-directory: bindings/java
        env:
          # git-versioning reads GITHUB_REF on Actions, so checking the tag out does not change
          # the version. Naming the tag is what makes the steps below build the release version
          # instead of a snapshot of the branch they run on. inputs.tag carries the same shape
          # on a workflow_dispatch run (see the trigger comment above), since github.ref_name
          # there is just whatever ref was dispatched against (main), not a version at all.
          VERSIONING_GIT_TAG: ${{ inputs.tag || github.ref_name }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish jreleaserFullRelease --no-daemon --stacktrace
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jreleaser-release
          path: |
            bindings/java/build/jreleaser/trace.log
            bindings/java/build/jreleaser/output.properties
          if-no-files-found: ignore
