name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: aarch64
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install libclang
        run:  sudo apt-get update && sudo apt-get install  llvm llvm-dev llvm-runtime libclang-dev
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - if: matrix.platform.target != 'x86_64'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.x
      - name: Build wheels
        id: build-wheels-1
        continue-on-error: true
        uses: PyO3/maturin-action@e10f6c464b90acceb5f640d31beda6d586ba7b4a # v1.49.3
        with: &build-wheels-args
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          working-directory: ./crates/frontends/python
          sccache: false
          manylinux: 2_28
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.14.1
          before-script-linux: |
            if command -v yum &> /dev/null; then
              yum install -y clang-devel llvm-devel
            elif command -v apt-get &> /dev/null; then
              apt-get update -y && apt-get install -y clang libclang-dev llvm-dev
            elif command -v apk &> /dev/null; then
              apk add clang-dev llvm-dev
            fi
            # espeak-ng's build runs its own freshly cross-compiled binary to
            # generate data files; under qemu-user emulation it needs the
            # target sysroot to resolve its dynamic loader.
            sysroot=/usr/aarch64-unknown-linux-gnu/aarch64-unknown-linux-gnu/sysroot
            if [ -d "$sysroot" ]; then
              export QEMU_LD_PREFIX="$sysroot"
              # Without a target sysroot, dengjen-espeak-rs-sys's bindgen step falls back to host
              # (x86_64) headers, which fail parsing aarch64 glibc multiarch headers.
              export BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_gnu="--sysroot=$sysroot"
            fi
      # maturin-action's fetch of its maturin binary occasionally truncates and isn't its own
      # step to retry individually, so the whole build retries with a back-off sleep between attempts.
      - name: Wait before retry 1
        if: steps.build-wheels-1.outcome == 'failure'
        run: sleep 20
      - name: Build wheels (retry 1)
        id: build-wheels-2
        if: steps.build-wheels-1.outcome == 'failure'
        continue-on-error: true
        uses: PyO3/maturin-action@e10f6c464b90acceb5f640d31beda6d586ba7b4a # v1.49.3
        with: *build-wheels-args
      - name: Wait before retry 2
        if: steps.build-wheels-2.outcome == 'failure'
        run: sleep 20
      - name: Build wheels (retry 2)
        id: build-wheels-3
        if: steps.build-wheels-2.outcome == 'failure'
        continue-on-error: true
        uses: PyO3/maturin-action@e10f6c464b90acceb5f640d31beda6d586ba7b4a # v1.49.3
        with: *build-wheels-args
      - name: Wait before retry 3
        if: steps.build-wheels-3.outcome == 'failure'
        run: sleep 20
      - name: Build wheels (retry 3)
        if: steps.build-wheels-3.outcome == 'failure'
        uses: PyO3/maturin-action@e10f6c464b90acceb5f640d31beda6d586ba7b4a # v1.49.3
        with: *build-wheels-args
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    env:
      CMAKE_GENERATOR: Ninja
    strategy:
      matrix:
        platform:
          - runner: windows-2022
            target: x64
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install-clang
        run: choco install llvm
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.platform.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e10f6c464b90acceb5f640d31beda6d586ba7b4a # v1.49.3
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          working-directory: ./crates/frontends/python
          sccache: false
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.14.1
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - runner: macos-latest
            target: aarch64
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install libclang
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@e10f6c464b90acceb5f640d31beda6d586ba7b4a # v1.49.3
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          working-directory: ./crates/frontends/python
          sccache: false
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.14.1
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: git-submodule-workaround
        run:
          git config --global protocol.file.allow always
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e10f6c464b90acceb5f640d31beda6d586ba7b4a # v1.49.3
        with:
          command: sdist
          args: --out dist
          working-directory: ./crates/frontends/python
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.14.1
      - name: Upload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-sdist
          path: dist

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install libclang, espeak-ng, and protoc
        run: sudo apt-get update && sudo apt-get install -y llvm llvm-dev llvm-runtime libclang-dev espeak-ng protobuf-compiler
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: cargo test (workspace, excluding dengjen-espeak-phonemizer, dengjen-tts, and dengjen-tts-kokoro)
        run: cargo test --workspace --exclude dengjen-espeak-phonemizer --exclude dengjen-tts --exclude dengjen-tts-kokoro --no-fail-fast
      - name: locate espeak-ng-data directory
        run: |
          data_dir="$(dirname "$(find /usr -maxdepth 5 -type d -name espeak-ng-data -not -path '/usr/share/doc/*' | head -n1)")"
          if [ -z "$data_dir" ] || [ "$data_dir" = "." ]; then
            echo "Could not locate an espeak-ng-data directory" >&2
            exit 1
          fi
          echo "DENGJEN_ESPEAKNG_DATA_DIRECTORY=$data_dir" >> "$GITHUB_ENV"
      - name: cargo test (dengjen-espeak-phonemizer, single-threaded)
        run: cargo test -p dengjen-espeak-phonemizer -- --test-threads=1
      - name: cargo test (dengjen-tts-piper, hebrew and pinyin features enabled)
        run: cargo test -p dengjen-tts-piper --no-default-features --features espeak,tashkeel,hebrew,pinyin
      - name: cargo test (dengjen-tts-piper, espeak feature disabled)
        run: cargo test -p dengjen-tts-piper --no-default-features --features tashkeel
      - name: cargo test (dengjen-tts-kokoro, espeak feature enabled)
        run: cargo test -p dengjen-tts-kokoro --features espeak
      - name: cargo test (dengjen-tts-kokoro, espeak feature disabled)
        run: cargo test -p dengjen-tts-kokoro --no-default-features

  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, windows, macos, sdist]
    steps:
      # No `working-directory` here: `path: dist` downloads artifacts to $GITHUB_WORKSPACE/dist/, and
      # the upload glob matches workspace-root-relative -- a working-directory previously made that
      # glob look under crates/frontends/python, which matched nothing.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
      - name: Publish to PyPI
        uses: PyO3/maturin-action@e10f6c464b90acceb5f640d31beda6d586ba7b4a # v1.49.3
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/wheels-*/*
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.14.1
