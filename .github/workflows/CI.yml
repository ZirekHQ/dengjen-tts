name: CI

# No `tags:` trigger here -- release.yml's `tag-and-release` job already dispatches this
# workflow explicitly once the tag is pushed, so also matching the tag push would run the
# full build matrix and the `release` job (PyPI) twice per release.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      use_oidc_pypi:
        description: "Use PyPI OIDC trusted publishing instead of PYPI_API_TOKEN (manual-dispatch only, for validating Trusted Publisher config -- dispatch against an existing release tag so the release job's ref condition below still fires)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Each tag push gets its own ref (refs/tags/vX.Y.Z), so this never collides with -- and
# never cancels -- the release job's run; only superseded main/PR builds get cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: aarch64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: llvm llvm-dev llvm-runtime libclang-dev
      - if: matrix.platform.target != 'x86_64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.x
      - name: Build wheels
        id: build-wheels-1
        continue-on-error: true
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with: &build-wheels-args
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          working-directory: ./crates/frontends/python
          sccache: false
          manylinux: 2_28
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.15.0
          before-script-linux: |
            export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a
            if command -v yum &> /dev/null; then
              yum install -y clang-devel llvm-devel
            elif command -v apt-get &> /dev/null; then
              apt-get update -y && apt-get install -y clang libclang-dev llvm-dev
            elif command -v apk &> /dev/null; then
              apk add clang-dev llvm-dev
            fi
            # espeak-ng's build runs its own freshly cross-compiled binary to
            # generate data files; under qemu-user emulation it needs the
            # target sysroot to resolve its dynamic loader.
            sysroot=/usr/aarch64-unknown-linux-gnu/aarch64-unknown-linux-gnu/sysroot
            if [ -d "$sysroot" ]; then
              export QEMU_LD_PREFIX="$sysroot"
              # Without a target sysroot, dengjen-espeak-rs-sys's bindgen step falls back to host
              # (x86_64) headers, which fail parsing aarch64 glibc multiarch headers.
              export BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_gnu="--sysroot=$sysroot"
            fi
      # maturin-action's fetch of its maturin binary occasionally truncates and isn't its own
      # step to retry individually, so the whole build retries with a back-off sleep between attempts.
      - name: Wait before retry 1
        if: steps.build-wheels-1.outcome == 'failure'
        run: sleep 20
      - name: Build wheels (retry 1)
        id: build-wheels-2
        if: steps.build-wheels-1.outcome == 'failure'
        continue-on-error: true
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with: *build-wheels-args
      - name: Wait before retry 2
        if: steps.build-wheels-2.outcome == 'failure'
        run: sleep 20
      - name: Build wheels (retry 2)
        id: build-wheels-3
        if: steps.build-wheels-2.outcome == 'failure'
        continue-on-error: true
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with: *build-wheels-args
      - name: Wait before retry 3
        if: steps.build-wheels-3.outcome == 'failure'
        run: sleep 20
      - name: Build wheels (retry 3)
        if: steps.build-wheels-3.outcome == 'failure'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with: *build-wheels-args
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CMAKE_GENERATOR: Ninja
    strategy:
      matrix:
        platform:
          - runner: windows-2022
            target: x64
    steps:
      - name: install-clang
        run: choco install llvm
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.platform.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          working-directory: ./crates/frontends/python
          sccache: false
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.15.0
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - runner: macos-latest
            target: aarch64
    steps:
      - name: install libclang
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          working-directory: ./crates/frontends/python
          sccache: false
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.15.0
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          working-directory: ./crates/frontends/python
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.15.0
      - name: Upload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-sdist
          path: dist

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: llvm llvm-dev llvm-runtime libclang-dev espeak-ng protobuf-compiler
      - name: cargo test (workspace, excluding dengjen-espeak-phonemizer, dengjen-tts, and dengjen-tts-kokoro)
        run: cargo test --workspace --exclude dengjen-espeak-phonemizer --exclude dengjen-tts --exclude dengjen-tts-kokoro --no-fail-fast
      - name: locate espeak-ng-data directory
        run: |
          data_dir="$(dirname "$(find /usr -maxdepth 5 -type d -name espeak-ng-data -not -path '/usr/share/doc/*' | head -n1)")"
          if [ -z "$data_dir" ] || [ "$data_dir" = "." ]; then
            echo "Could not locate an espeak-ng-data directory" >&2
            exit 1
          fi
          echo "DENGJEN_ESPEAKNG_DATA_DIRECTORY=$data_dir" >> "$GITHUB_ENV"
      - name: cargo test (dengjen-espeak-phonemizer, single-threaded)
        run: cargo test -p dengjen-espeak-phonemizer -- --test-threads=1
      - name: cargo test (dengjen-tts-piper, hebrew and pinyin features enabled)
        run: cargo test -p dengjen-tts-piper --no-default-features --features espeak,tashkeel,hebrew,pinyin
      - name: cargo test (dengjen-tts-piper, espeak feature disabled)
        run: cargo test -p dengjen-tts-piper --no-default-features --features tashkeel
      - name: cargo test (dengjen-tts-kokoro, espeak feature enabled)
        run: cargo test -p dengjen-tts-kokoro --features espeak
      - name: cargo test (dengjen-tts-kokoro, espeak feature disabled)
        run: cargo test -p dengjen-tts-kokoro --no-default-features

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Only exercised when use_oidc_pypi is set, which only workflow_dispatch can do -- the
      # tag-triggered automated path never sets it, so it never attempts an OIDC token mint.
      id-token: write
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, windows, macos, sdist]
    env:
      USE_OIDC_PYPI: ${{ github.event_name == 'workflow_dispatch' && inputs.use_oidc_pypi == true }}
    steps:
      # No `working-directory` here: `path: dist` downloads artifacts to $GITHUB_WORKSPACE/dist/, and
      # the upload glob matches workspace-root-relative -- a working-directory previously made that
      # glob look under crates/frontends/python, which matched nothing.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
      - name: Publish to PyPI
        if: env.USE_OIDC_PYPI != 'true'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/wheels-*/*
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.15.0
      # packages-dir below needs a flat directory, not a glob -- re-downloads separately rather
      # than changing the first download step's subdirectory layout, which the maturin-action
      # step's shell-expanded glob (dist/wheels-*/*) above depends on.
      - name: Download wheels for OIDC test (flat layout)
        if: env.USE_OIDC_PYPI == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheels-*
          path: dist-oidc
          merge-multiple: true
      # Not yet the default: PyPI's Trusted Publisher config doesn't exist yet -- this validates
      # it via manual dispatch first. maturin-action has no OIDC support of its own, hence a
      # separate action here rather than a flag on the step above.
      - name: Publish to PyPI via OIDC (manual validation only)
        if: env.USE_OIDC_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-oidc
          skip-existing: true
