name: Publish to crates.io

on:
  push:
    tags:
      - "publish-*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev llvm-dev cmake protobuf-compiler
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"

      - name: Resolve workspace version
        # Read from [workspace.package] rather than hardcoding it per crate
        # below, so this file doesn't silently go stale (and wait for the
        # wrong version to index) the next time the workspace version bumps.
        id: version
        run: |
          set -euo pipefail
          version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Verify (build + package) each crate before CARGO_REGISTRY_TOKEN ever
      # enters the environment, so a malicious build.rs/proc-macro in the
      # crate or its dependencies has no token to exfiltrate. --dry-run does
      # the same build/verify cargo publish would, without uploading and
      # without requiring the token.
      - name: verify tier 1 (audio-ops, sonic-sys)
        run: |
          cargo publish --dry-run --locked -p audio-ops
          cargo publish --dry-run --locked -p sonic-sys
      - name: publish tier 1 (audio-ops, sonic-sys)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p audio-ops --locked --no-verify
          cargo publish -p sonic-sys --locked --no-verify
      - name: wait for tier 1 to index
        run: |
          bash .github/scripts/wait-for-crate.sh audio-ops "${{ steps.version.outputs.version }}"
          bash .github/scripts/wait-for-crate.sh sonic-sys "${{ steps.version.outputs.version }}"

      - name: verify tier 2 (dengjen-tts-core)
        run: cargo publish --dry-run --locked -p dengjen-tts-core
      - name: publish tier 2 (dengjen-tts-core)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p dengjen-tts-core --locked --no-verify
      - name: wait for tier 2 to index
        run: bash .github/scripts/wait-for-crate.sh dengjen-tts-core "${{ steps.version.outputs.version }}"

      - name: verify tier 3 (hebrew-phonemizer, pinyin-phonemizer)
        run: |
          cargo publish --dry-run --locked -p hebrew-phonemizer
          cargo publish --dry-run --locked -p pinyin-phonemizer
      - name: publish tier 3 (hebrew-phonemizer, pinyin-phonemizer)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p hebrew-phonemizer --locked --no-verify
          cargo publish -p pinyin-phonemizer --locked --no-verify
      - name: wait for tier 3 to index
        run: |
          bash .github/scripts/wait-for-crate.sh hebrew-phonemizer "${{ steps.version.outputs.version }}"
          bash .github/scripts/wait-for-crate.sh pinyin-phonemizer "${{ steps.version.outputs.version }}"
