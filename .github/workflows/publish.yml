name: Publish to crates.io

# Called directly as a job (`uses:`) from tag-and-release.yml's single
# release pipeline, in the same run that tags vX.Y.Z -- so it and the other
# release targets share one `environment: release` approval screen instead
# of each needing a separate click. Also dispatchable by hand -- from the
# Actions tab, or `gh workflow run publish.yml` -- which is the retry path
# if a partial run fails: every step below is idempotent (skips a crate
# crates.io already has, via .github/scripts/publish-crate-if-needed.sh),
# so re-running this from scratch after a failure is always safe, no new
# tag needed. Deliberately not tag-triggered itself: a `push: tags:`
# listener here would mean any human pushing an unrelated v*-shaped tag by
# mistake fires a real, irreversible crates.io publish.
on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev llvm-dev cmake protobuf-compiler
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"

      - name: Resolve workspace version
        # Read from [workspace.package] rather than hardcoding it per crate
        # below, so this file doesn't silently go stale (and wait for the
        # wrong version to index) the next time the workspace version bumps.
        id: version
        run: |
          set -euo pipefail
          version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # publish-crate-if-needed.sh skips a crate crates.io already has (a
      # curl lookup, no token needed for that check) and only invokes
      # `cargo publish` -- itself equivalent to the old dry-run verify plus
      # a real upload -- for one crates.io doesn't have yet. See the
      # script's own comment for why the idempotency check happens before
      # CARGO_REGISTRY_TOKEN is read into a step's environment at all.
      - name: publish tier 1 (dengjen-audio-ops, dengjen-sonic-sys)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/publish-crate-if-needed.sh dengjen-audio-ops "$VERSION"
          bash .github/scripts/publish-crate-if-needed.sh dengjen-sonic-sys "$VERSION"
      - name: wait for tier 1 to index
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/wait-for-crate.sh dengjen-audio-ops "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-sonic-sys "$VERSION"

      - name: publish tier 2 (dengjen-tts-core)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-tts-core "$VERSION"
      - name: wait for tier 2 to index
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/wait-for-crate.sh dengjen-tts-core "$VERSION"

      - name: publish tier 3 (dengjen-hebrew-phonemizer, dengjen-pinyin-phonemizer)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/publish-crate-if-needed.sh dengjen-hebrew-phonemizer "$VERSION"
          bash .github/scripts/publish-crate-if-needed.sh dengjen-pinyin-phonemizer "$VERSION"
      - name: wait for tier 3 to index
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/wait-for-crate.sh dengjen-hebrew-phonemizer "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-pinyin-phonemizer "$VERSION"

      - name: publish tier 4 (dengjen-espeak-phonemizer)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-espeak-phonemizer "$VERSION"
      - name: wait for tier 4 to index
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/wait-for-crate.sh dengjen-espeak-phonemizer "$VERSION"

      - name: publish tier 5 (dengjen-tts-piper, dengjen-tts-kokoro, dengjen-tts-melotts)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/publish-crate-if-needed.sh dengjen-tts-piper "$VERSION"
          bash .github/scripts/publish-crate-if-needed.sh dengjen-tts-kokoro "$VERSION"
          bash .github/scripts/publish-crate-if-needed.sh dengjen-tts-melotts "$VERSION"
      - name: wait for tier 5 to index
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/wait-for-crate.sh dengjen-tts-piper "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-tts-kokoro "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-tts-melotts "$VERSION"

      - name: publish tier 6 (dengjen-tts)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-tts "$VERSION"
      - name: wait for tier 6 to index
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/wait-for-crate.sh dengjen-tts "$VERSION"

      - name: publish tier 7 (dengjen-tts-cli, dengjen-tts-grpc, dengjen-tts-python, libdengjen)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/publish-crate-if-needed.sh dengjen-tts-cli "$VERSION"
          bash .github/scripts/publish-crate-if-needed.sh dengjen-tts-grpc "$VERSION"
          bash .github/scripts/publish-crate-if-needed.sh dengjen-tts-python "$VERSION"
          bash .github/scripts/publish-crate-if-needed.sh libdengjen "$VERSION"
      - name: wait for tier 7 to index
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/wait-for-crate.sh dengjen-tts-cli "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-tts-grpc "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-tts-python "$VERSION"
          bash .github/scripts/wait-for-crate.sh libdengjen "$VERSION"
