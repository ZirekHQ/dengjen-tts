name: Publish Python wheels

# Called as a job of release.yml's flow; release.yml's own gate job (single-trigger,
# single-gate) covers this file too, so it has none of its own. Separate from CI.yml's
# own build matrix, which smoke-tests on every push/PR but never publishes -- this file
# duplicates that matrix rather than sharing it, same split tashkeel already uses for its
# own python-wheel.yml (CI-only) vs python-publish.yml (release-only) pair.
#
# PYPI_API_TOKEN is optional and PyPI publishing is non-blocking: this repo has never
# actually published to PyPI (no secret configured, pydengjen doesn't exist on PyPI yet),
# so making this job's success required elsewhere would turn a pre-existing, already-broken
# capability into a hard release blocker. Wheels still build either way, for parity checking.
on:
  workflow_call:
    inputs:
      dry_run:
        required: false
        type: boolean
        default: false
    secrets:
      PYPI_API_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: aarch64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: llvm llvm-dev llvm-runtime libclang-dev
      - if: matrix.platform.target != 'x86_64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.x
      - name: Build wheels
        id: build-wheels-1
        continue-on-error: true
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with: &build-wheels-args
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          working-directory: ./crates/frontends/python
          sccache: false
          manylinux: 2_28
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.15.0
          before-script-linux: |
            export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a
            if command -v yum &> /dev/null; then
              yum install -y clang-devel llvm-devel
            elif command -v apt-get &> /dev/null; then
              apt-get update -y && apt-get install -y clang libclang-dev llvm-dev
            elif command -v apk &> /dev/null; then
              apk add clang-dev llvm-dev
            fi
            # espeak-ng's build runs its own freshly cross-compiled binary to
            # generate data files; under qemu-user emulation it needs the
            # target sysroot to resolve its dynamic loader.
            sysroot=/usr/aarch64-unknown-linux-gnu/aarch64-unknown-linux-gnu/sysroot
            if [ -d "$sysroot" ]; then
              export QEMU_LD_PREFIX="$sysroot"
              # Without a target sysroot, dengjen-espeak-rs-sys's bindgen step falls back to host
              # (x86_64) headers, which fail parsing aarch64 glibc multiarch headers.
              export BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_gnu="--sysroot=$sysroot"
            fi
      # maturin-action's fetch of its maturin binary occasionally truncates and isn't its own
      # step to retry individually, so the whole build retries with a back-off sleep between attempts.
      - name: Wait before retry 1
        if: steps.build-wheels-1.outcome == 'failure'
        run: sleep 20
      - name: Build wheels (retry 1)
        id: build-wheels-2
        if: steps.build-wheels-1.outcome == 'failure'
        continue-on-error: true
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with: *build-wheels-args
      - name: Wait before retry 2
        if: steps.build-wheels-2.outcome == 'failure'
        run: sleep 20
      - name: Build wheels (retry 2)
        id: build-wheels-3
        if: steps.build-wheels-2.outcome == 'failure'
        continue-on-error: true
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with: *build-wheels-args
      - name: Wait before retry 3
        if: steps.build-wheels-3.outcome == 'failure'
        run: sleep 20
      - name: Build wheels (retry 3)
        if: steps.build-wheels-3.outcome == 'failure'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with: *build-wheels-args
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          # maturin-action's working-directory (above) is where --out dist actually lands --
          # not the workspace root upload-artifact resolves `path:` against by default.
          path: crates/frontends/python/dist
          if-no-files-found: error

  windows:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CMAKE_GENERATOR: Ninja
    strategy:
      matrix:
        platform:
          - runner: windows-2022
            target: x64
    steps:
      - name: install-clang
        run: choco install llvm
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.platform.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          working-directory: ./crates/frontends/python
          sccache: false
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.15.0
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: crates/frontends/python/dist
          if-no-files-found: error

  macos:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - runner: macos-latest
            target: aarch64
    steps:
      - name: install libclang
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          working-directory: ./crates/frontends/python
          sccache: false
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.15.0
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: crates/frontends/python/dist
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          working-directory: ./crates/frontends/python
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.15.0
      - name: Upload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-sdist
          path: crates/frontends/python/dist
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # `if:` can't reference `secrets.*` directly -- mirror it into `env` so the step below can.
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      # github.workflow_ref stays bound to the top-level caller even inside a called reusable
      # workflow -- rejects a differently-named workflow file invoking this publish flow directly,
      # or a workflow_dispatch of release.yml from a non-main branch, either of which would skip
      # release.yml's tag-and-release gate. Same check as publish-crates/go/grpc/java.yml.
      - name: verify this workflow was only reached through release.yml on main
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          expected="ZirekHQ/dengjen-tts/.github/workflows/release.yml@refs/heads/main"
          if [ "$WORKFLOW_REF" != "$expected" ]; then
            echo "::error::workflow_ref is '${WORKFLOW_REF}', expected '${expected}' -- refusing to run outside release.yml's main-branch flow" >&2
            exit 1
          fi
      # No `working-directory` here: `path: dist` downloads artifacts to $GITHUB_WORKSPACE/dist/, and
      # the upload glob matches workspace-root-relative -- a working-directory previously made that
      # glob look under crates/frontends/python, which matched nothing.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
      - name: Publish to PyPI
        # PYPI_API_TOKEN is optional -- see the file header. Unset, it reads as an empty string
        # here, so this skips gracefully rather than uploading with a blank token.
        if: inputs.dry_run != true && env.PYPI_API_TOKEN != ''
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MATURIN_PYPI_TOKEN: ${{ env.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/wheels-*/*
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.15.0
