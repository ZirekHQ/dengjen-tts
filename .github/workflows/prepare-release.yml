name: Prepare release

# Proposes a release; merging the opened PR is what actually cuts one -- release.yml tags that
# merge commit and triggers every downstream release workflow automatically.
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install build dependencies
        run: sudo apt-get update && sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y clang libclang-dev llvm-dev cmake protobuf-compiler
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: main
          submodules: recursive
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"

      - name: Compute next version
        id: next
        run: |
          set -uo pipefail
          # `run:` steps execute as `bash -e {0}` regardless of `set` above -- a bare assignment
          # would abort here on next-version.sh's exit 1, before rc is ever inspected.
          if version="$(bash scripts/next-version.sh)"; then
            rc=0
          else
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "::notice::Nothing release-worthy since the last tag -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::scripts/next-version.sh failed (exit ${rc})"
            exit "$rc"
          fi

      - name: Bump version
        if: steps.next.outputs.skip != 'true'
        run: bash scripts/bump-version.sh "${STEPS_NEXT_OUTPUTS_VERSION}"
        env:
          STEPS_NEXT_OUTPUTS_VERSION: ${{ steps.next.outputs.version }}

      - name: Open release PR
        if: steps.next.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/bump-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Cargo.toml Cargo.lock crates/frontends/python/Cargo.toml
          git commit -m "chore: bump workspace version -> ${VERSION}"
          git push -u origin "$branch"
          gh pr create --title "chore: bump workspace version -> ${VERSION}" \
            --body "Computed by \`prepare-release.yml\` from Conventional Commit subjects since the last tag (see \`scripts/next-version.sh\`). **Merging this releases v${VERSION}**: \`release.yml\` tags this merge commit \`v${VERSION}\` and runs \`publish.yml\` (crates.io), \`java-publish.yml\` (Maven Central), \`publish-go.yml\` (the ZirekHQ/dengjen-tts-go mirror), and \`publish-grpc.yml\` (the gRPC server's GitHub Release) as jobs of that same run, plus dispatches \`CI.yml\`'s release job (PyPI) separately. Review the version and the diff before merging -- the only manual step left after that is one approval click for the batched \`environment: release\` gate the first four share (PyPI has none)." \
            --base main --head "$branch"
