name: Prepare release

# Computes the next semver version from Conventional Commit subjects merged
# to main since the last vX.Y.Z tag (scripts/next-version.sh) and opens a PR
# bumping the workspace version (scripts/bump-version.sh). Manual trigger
# only -- this proposes a release, it doesn't cut one. Merging the PR is the
# one remaining human gate: tag-and-release.yml then tags that commit
# vX.Y.Z and triggers every downstream release workflow (crates.io, Maven
# Central, PyPI, the ZirekHQ/dengjen-tts-go mirror, the gRPC server's
# GitHub Release) automatically, no further manual tag pushes needed.
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev llvm-dev cmake protobuf-compiler
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: main
          submodules: recursive
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97.1"

      - name: Compute next version
        id: next
        run: |
          set -uo pipefail
          # next-version.sh exits 1 for the normal "nothing release-worthy"
          # case, which this step treats as skip -- but exit 2 (or anything
          # else unexpected) means the computation itself is broken (e.g. no
          # vX.Y.Z tag exists at all), and must fail loudly instead, or a
          # broken tag state would silently suppress every future release.
          #
          # The command substitution below is deliberately the condition of
          # an `if`, not a bare assignment -- GitHub Actions runs `run:`
          # steps as `bash -e {0}` regardless of this script's own `set`
          # flags, and a bare `version="$(...)"` is a simple command that
          # `-e` would abort on before `rc=$?` ever ran, making the exit-1
          # skip case below unreachable.
          if version="$(bash scripts/next-version.sh)"; then
            rc=0
          else
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "::notice::Nothing release-worthy since the last tag -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::scripts/next-version.sh failed (exit ${rc})"
            exit "$rc"
          fi

      - name: Bump version
        if: steps.next.outputs.skip != 'true'
        run: bash scripts/bump-version.sh "${{ steps.next.outputs.version }}"

      - name: Open release PR
        if: steps.next.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/bump-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Cargo.toml Cargo.lock crates/frontends/python/Cargo.toml
          git commit -m "chore: bump workspace version -> ${VERSION}"
          git push -u origin "$branch"
          gh pr create --title "chore: bump workspace version -> ${VERSION}" \
            --body "Computed by \`prepare-release.yml\` from Conventional Commit subjects since the last tag (see \`scripts/next-version.sh\`). **Merging this releases v${VERSION}**: \`tag-and-release.yml\` tags this merge commit \`v${VERSION}\` and runs \`publish.yml\` (crates.io), \`java-publish.yml\` (Maven Central), \`publish-go.yml\` (the ZirekHQ/dengjen-tts-go mirror), and \`publish-grpc.yml\` (the gRPC server's GitHub Release) as jobs of that same run, plus dispatches \`CI.yml\`'s release job (PyPI) separately. Review the version and the diff before merging -- the only manual step left after that is one approval click for the batched \`environment: release\` gate the first four share (PyPI has none)." \
            --base main --head "$branch"
