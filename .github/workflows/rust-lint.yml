name: Rust Lint

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, not per-PR: real-voice-e2e (below) downloads real model weights, too slow/costly
    # to run on every push.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev llvm-dev cmake protobuf-compiler
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"
          components: clippy
      - run: cargo install clippy-sarif sarif-fmt --locked
      - name: cargo clippy
        # benches/tests are excluded since crates/audio/ops's bench has a
        # pre-existing broken import. Scoped to what actually ships.
        #
        # SonarCloud has no Rust analyzer (see sonar-project.properties), so the
        # ruleset's code_scanning rule has nothing to source Rust findings from
        # unless something uploads SARIF for these crates. Piping clippy's own
        # JSON output through clippy-sarif does that instead of standing up
        # CodeQL, whose Rust support is still much thinner than clippy's.
        run: |
          set -o pipefail
          cargo clippy --workspace --lib --bins --message-format=json -- -D warnings \
            | clippy-sarif | tee clippy-results.sarif | sarif-fmt
      - name: upload clippy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: clippy-results.sarif

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # Licenses/bans/sources are cheap and don't need a full build. Advisories are also
          # covered by the separate `rustsec/audit-check` job above (kept as belt-and-braces).
          command: check licenses bans sources

  # crates/audio/sonic-sys/build.rs compiles vendor/sonic.c and .h, not deps/sonic's copies, so
  # nothing in the build touches the deps/sonic submodule anymore. Renovate still keeps that
  # submodule pinned to a tracked branch and will keep opening bump PRs for it; without this
  # check, merging one would pass CI green while silently leaving vendor/ stale.
  vendor-drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: vendor drift check
        run: |
          diff -q deps/sonic/sonic.c crates/audio/sonic-sys/vendor/sonic.c
          diff -q deps/sonic/sonic.h crates/audio/sonic-sys/vendor/sonic.h

  # Miri can't run this workspace's unsafe code: every unsafe block here calls into real linked
  # C libraries (onnxruntime, libsonic, espeak-ng), and Miri doesn't support arbitrary FFI.
  # AddressSanitizer does support real FFI, so it's used instead — validated locally to be clean
  # against libdengjen (the public C ABI) and dengjen-tts (the dengjen-sonic-sys FFI boundary).
  asan:
    runs-on: ubuntu-latest
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev llvm-dev cmake protobuf-compiler espeak-ng
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly
          components: rust-src
      - name: locate espeak-ng-data directory
        run: |
          data_dir="$(dirname "$(find /usr -maxdepth 5 -type d -name espeak-ng-data -not -path '/usr/share/doc/*' | head -n1)")"
          if [ -z "$data_dir" ] || [ "$data_dir" = "." ]; then
            echo "Could not locate an espeak-ng-data directory" >&2
            exit 1
          fi
          echo "DENGJEN_ESPEAKNG_DATA_DIRECTORY=$data_dir" >> "$GITHUB_ENV"
      - name: cargo test under AddressSanitizer (libdengjen, dengjen-tts)
        env:
          RUSTFLAGS: -Z sanitizer=address
        # test_lazy_stream/test_parallel_stream/test_realtime_stream need real model fixture
        # files not present in CI (same reason CI.yml's main test job excludes dengjen-tts
        # entirely); everything else, including the synthetic-model tests in the same binary,
        # still runs.
        run: cargo +nightly test -p libdengjen -p dengjen-tts -Zbuild-std --target x86_64-unknown-linux-gnu -- --skip test_lazy_stream --skip test_parallel_stream --skip test_realtime_stream
      - name: cargo test under AddressSanitizer (dengjen-espeak-phonemizer, single-threaded)
        env:
          RUSTFLAGS: -Z sanitizer=address
          # See .github/asan-suppressions/lsan.txt: espeak-ng's own SetVoiceByName leaks a
          # small voice-table allocation on every voice switch. Vendored upstream C, not ours.
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/asan-suppressions/lsan.txt
        run: cargo +nightly test -p dengjen-espeak-phonemizer -Zbuild-std --target x86_64-unknown-linux-gnu -- --test-threads=1

  # Build-only smoke check so the fuzz targets don't silently bit-rot. Actual fuzzing
  # (finding new crashes) is a longer-running job better suited to a schedule than every PR —
  # run one manually with `cargo fuzz run <target>` from the crate that owns it:
  #   map_phonemes_to_ids   crates/dengjen/models/piper
  #   normalize_numbers     crates/text/pinyin-phonemizer
  #   num_classes           crates/text/hebrew-phonemizer
  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev llvm-dev cmake protobuf-compiler
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly
          components: rust-src
      - run: cargo install cargo-fuzz --locked
      - name: cargo fuzz build (map_phonemes_to_ids)
        working-directory: crates/dengjen/models/piper
        run: cargo +nightly fuzz build
      - name: cargo fuzz build (normalize_numbers)
        working-directory: crates/text/pinyin-phonemizer
        run: cargo +nightly fuzz build
      - name: cargo fuzz build (num_classes)
        working-directory: crates/text/hebrew-phonemizer
        run: cargo +nightly fuzz build

  # Mirrors CI.yml's `test` job's per-crate invocations exactly, but under
  # cargo-llvm-cov instrumentation, so the merged Cobertura report reflects the
  # same set of crates/features that job actually exercises. SonarCloud never
  # scanned any of this (see sonar-project.properties) so it had no coverage
  # data to feed the ruleset's code_coverage rule; this reports straight to
  # GitHub's own code coverage feature instead.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install libclang, espeak-ng, and protoc
        run: sudo apt-get update && sudo apt-get install -y llvm llvm-dev llvm-runtime libclang-dev espeak-ng protobuf-compiler
      # actions/checkout defaults to the synthetic merge commit for pull_request events, but
      # GitHub's code coverage feature (see the upload step below) annotates the PR's file-diff
      # view against the head commit -- checking out the merge commit here means the upload
      # never lines up with anything the PR view actually shows.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"
          components: llvm-tools-preview
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-llvm-cov
      - name: cargo llvm-cov (workspace, excluding dengjen-espeak-phonemizer, dengjen-tts, and dengjen-tts-kokoro)
        run: cargo llvm-cov --no-report --workspace --exclude dengjen-espeak-phonemizer --exclude dengjen-tts --exclude dengjen-tts-kokoro --no-fail-fast
      - name: locate espeak-ng-data directory
        run: |
          data_dir="$(dirname "$(find /usr -maxdepth 5 -type d -name espeak-ng-data -not -path '/usr/share/doc/*' | head -n1)")"
          if [ -z "$data_dir" ] || [ "$data_dir" = "." ]; then
            echo "Could not locate an espeak-ng-data directory" >&2
            exit 1
          fi
          echo "DENGJEN_ESPEAKNG_DATA_DIRECTORY=$data_dir" >> "$GITHUB_ENV"
      - name: cargo llvm-cov (dengjen-espeak-phonemizer, single-threaded)
        run: cargo llvm-cov --no-report -p dengjen-espeak-phonemizer -- --test-threads=1
      - name: cargo llvm-cov (dengjen-tts-piper, hebrew and pinyin features enabled)
        run: cargo llvm-cov --no-report -p dengjen-tts-piper --no-default-features --features espeak,tashkeel,hebrew,pinyin
      - name: cargo llvm-cov (dengjen-tts-piper, espeak feature disabled)
        run: cargo llvm-cov --no-report -p dengjen-tts-piper --no-default-features --features tashkeel
      - name: cargo llvm-cov (dengjen-tts-kokoro, espeak feature enabled)
        run: cargo llvm-cov --no-report -p dengjen-tts-kokoro --features espeak
      - name: cargo llvm-cov (dengjen-tts-kokoro, espeak feature disabled)
        run: cargo llvm-cov --no-report -p dengjen-tts-kokoro --no-default-features
      - name: merge coverage into a Cobertura report
        run: cargo llvm-cov report --cobertura --output-path cobertura.xml
      - name: upload coverage report
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1
        with:
          file: cobertura.xml
          language: Rust

  # Runs the DENGJEN_KOKORO_TEST_VOICE_CONFIG-gated real-voice e2e tests
  # (dengjen-tts-kokoro's e2e_real_voice.rs, dengjen-tts-cli's kokoro_e2e.rs) against an actual
  # trained voice instead of the synthetic fixture every other job uses. Never runs on a
  # push/PR (real model weights are too large/slow to fetch on every run); only on the weekly
  # schedule above or a manual workflow_dispatch.
  #
  # No specific model source is configured here: verifying a third-party Kokoro export's
  # license and its exact file layout against KokoroVoiceConfig's schema is a one-time judgment
  # call for whoever maintains this repo, not something to hardcode sight-unseen. Set the
  # `KOKORO_TEST_VOICE_ARCHIVE_URL` repository variable (Settings > Secrets and variables >
  # Actions > Variables) to a .tar.gz whose root directory holds:
  #   - config.json               ({"model_path": ..., "voices_dir": ..., "vocab_path": ...},
  #                                 each path resolved relative to this same directory)
  #   - whatever those three fields name
  # The job's own `if:` skips it entirely (no runner allocated, nothing checked out) until
  # that variable is set.
  kokoro-real-voice-e2e:
    if: |
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.KOKORO_TEST_VOICE_ARCHIVE_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install libclang and espeak-ng
        run: sudo apt-get update && sudo apt-get install -y llvm llvm-dev llvm-runtime libclang-dev espeak-ng
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: download real Kokoro voice fixture
        run: |
          mkdir -p /tmp/kokoro-real-voice
          curl -fsSL "${{ vars.KOKORO_TEST_VOICE_ARCHIVE_URL }}" -o /tmp/kokoro-voice.tar.gz
          tar -xzf /tmp/kokoro-voice.tar.gz -C /tmp/kokoro-real-voice --strip-components=1
          echo "DENGJEN_KOKORO_TEST_VOICE_CONFIG=/tmp/kokoro-real-voice/config.json" >> "$GITHUB_ENV"
      - name: cargo test (dengjen-tts-kokoro, real voice e2e)
        run: cargo test -p dengjen-tts-kokoro --features espeak --test e2e_real_voice
      - name: cargo test (dengjen-tts-cli, kokoro real voice e2e)
        run: cargo test -p dengjen-tts-cli --test kokoro_e2e

  bindings-java:
    runs-on: ubuntu-latest
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev llvm-dev cmake protobuf-compiler
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 0 # needed so git-versioning's `git describe` can find the java-v* tag; shallow clones have no tags
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - name: make test
        working-directory: bindings/java
        run: make test
      - name: make fmt-check
        working-directory: bindings/java
        run: make fmt-check

  bindings-go:
    runs-on: ubuntu-latest
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev llvm-dev cmake protobuf-compiler
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
      - name: make test
        working-directory: bindings/go
        run: make test
      - name: make vet
        working-directory: bindings/go
        run: make vet
      - name: make fmt-check
        working-directory: bindings/go
        run: make fmt-check
