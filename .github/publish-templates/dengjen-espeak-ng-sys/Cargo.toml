[package]
name = "dengjen-espeak-ng-sys"
version = "0.2.1"
edition = "2021"
description = "Rust bindings to espeak-ng, vendoring and building it from source"
license = "MIT AND GPL-3.0-or-later"
repository = "https://github.com/ZirekHQ/dengjen-tts"
homepage = "https://github.com/ZirekHQ/dengjen-tts"
readme = "README.md"
keywords = ["FFI", "espeak", "espeak-ng", "tts", "speech"]
categories = ["external-ffi-bindings", "api-bindings"]

include = [
    "espeak-ng/CMakeLists.txt",
    "espeak-ng/cmake/",
    "espeak-ng/phsource/",
    "espeak-ng/src/",
    "espeak-ng/espeak-ng-data/",
    "espeak-ng/dictsource/**",
    "espeak-ng/espeak-ng.pc.in",
    "espeak-ng/COPYING",
    "src/*.rs",
    "build.rs",
    "wrapper.h",
    "README.md",
    # Omit too big files from dictsource
    "!espeak-ng/dictsource/extra/**",
    "!espeak-ng/dictsource/fo_list",
    "!espeak-ng/src/windows/Debug/*.wav",
    # vim/ and tests/ dropped: neither is referenced by CMakeLists.txt (ENABLE_TESTS is forced
    # OFF in build.rs), trimmed to stay clear of crates.io's 10MB .crate size cap; see #154.
    # Their README.md stubs still end up packaged regardless -- cargo force-includes any
    # README*/LICENSE* file it finds, independent of this include list.
]

[build-dependencies]
bindgen = "0.69.4"
cmake = "0.1"
glob = "0.3.1"

[features]
default = []
compile-espeak-intonations = []
